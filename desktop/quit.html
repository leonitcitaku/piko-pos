<!doctype html><meta charset="utf-8"><title>Quit Cafe POS</title>
<style>body{font:15px "Segoe UI",system-ui,sans-serif;margin:18px;color:#14201b}input{width:100%;height:42px;font-size:20px;padding:0 10px;box-sizing:border-box;margin:10px 0}
button{height:40px;padding:0 16px;font-weight:600}p{margin:0}#err{color:#b93a27;font-weight:600;min-height:20px}</style>
<p>Quitting stops the POS for every phone. Enter a manager or owner PIN.</p>
<input id="pin" type="password" inputmode="numeric" autofocus>
<p id="err"></p>
<button id="go">Quit Cafe POS</button> <button onclick="window.close()">Cancel</button>
<script>
const go = async () => { const r = await window.pos.quit(document.getElementById('pin').value); if (!r.ok) document.getElementById('err').textContent = r.message; };
document.getElementById('go').onclick = go;
document.getElementById('pin').onkeydown = (e) => e.key === 'Enter' && go();
</script>
